apiVersion: v1
kind: Namespace
metadata:
  name: lab-switchboard
  labels:
    app.kubernetes.io/part-of: lab-switchboard
    microsegmentation-lab/managed-by: microsegmentation-iac
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-switchboard
  namespace: lab-switchboard
  labels:
    app.kubernetes.io/part-of: lab-switchboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-switchboard
  namespace: lab-switchboard
  labels:
    app.kubernetes.io/part-of: lab-switchboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-switchboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab-switchboard
        app.kubernetes.io/part-of: lab-switchboard
    spec:
      serviceAccountName: lab-switchboard
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: docker.io/library/lab-switchboard:0.1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SWITCHBOARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab-switchboard-login
                  key: password
            - name: SWITCHBOARD_CONFIG
              value: /config/lab.json
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: lab-switchboard-config
---
apiVersion: v1
kind: Service
metadata:
  name: lab-switchboard
  namespace: lab-switchboard
  labels:
    app.kubernetes.io/part-of: lab-switchboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lab-switchboard
  ports:
    - name: http
      port: 80
      targetPort: http