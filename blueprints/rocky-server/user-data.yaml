#cloud-config
# Rendered per VM: {hostname}, {user}, {ssh_public_key}.
# Key-only SSH; NIC matching is by name via DHCP (never by MAC - KubeVirt
# masquerade MACs change every restart).
hostname: {hostname}
users:
  - name: {user}
    groups: [wheel]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - {ssh_public_key}
ssh_pwauth: false
package_update: true
packages:
  - qemu-guest-agent
runcmd:
  - systemctl enable --now qemu-guest-agent
