[project]
name = "lab"
version = "0.1.0"
description = "Declarative KubeVirt home lab: VMs on Kubernetes with one-command SSH/RDP"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
lab = "lab.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
